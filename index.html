      <div class="gb-tools" id="gb-tools">
        <div class="gb-group" id="gb-tool-set">
          <button class="gb-tool on" data-tool="pen" title="Draw">
            <svg viewBox="0 0 20 20"><path d="M3 17l1-4L14.2 2.8a1.8 1.8 0 0 1 2.5 0l.5.5a1.8 1.8 0 0 1 0 2.5L7 16l-4 1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
          <button class="gb-tool" data-tool="text" title="Add text">
            <svg viewBox="0 0 20 20"><path d="M4 5.5V4h12v1.5M10 4v12M7.5 16h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="gb-tool" data-tool="photo" title="Add a photo">
            <svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="8.2" r="1.4" fill="currentColor"/><path d="M3.4 14.2 7.6 10l3 2.6L13.4 10l3.2 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="gb-group gb-inks" id="gb-inks"></div>
        <div class="gb-group gb-right">
          <span class="gb-live">shared board — everyone draws here</span>
          <button class="gb-btn" id="gb-exit">Done</button>
        </div>
      </div>
      <input type="file" id="gb-file" accept="image/*" hidden>
      <div class="gb-caret" id="gb-caret" hidden></div>
    </div>


    <!-- ============ Finder window ============ -->
    <section class="window" id="window" role="application" aria-label="Finder">
      <div class="win-body">
        <aside class="sidebar" id="sidebar">
          <div class="traffic" id="traffic">
            <button class="tl tl-close" id="tl-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3.2 3.2l5.6 5.6M8.8 3.2 3.2 8.8" stroke="rgba(77,0,0,.85)" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="tl tl-min" id="tl-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2.8 6h6.4" stroke="rgba(90,50,0,.85)" stroke-width="1.5" stroke-linecap="round"/></svg></button>
            <button class="tl tl-zoom" id="tl-zoom" aria-label="Zoom"><svg viewBox="0 0 12 12"><path d="M3.3 6.7v2h2M8.7 5.3v-2h-2" stroke="rgba(0,70,0,.9)" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.4 8.6 5.9 6.1M8.6 3.4 6.1 5.9" stroke="rgba(0,70,0,.9)" stroke-width="1.3" stroke-linecap="round"/></svg></button>
            <button class="side-collapse" id="side-collapse" title="Collapse sidebar" aria-label="Collapse sidebar">
              <svg viewBox="0 0 20 20"><use href="#t-collapse"/></svg>
            </button>
          </div>
          <nav class="side-scroll" id="side-nav"><!-- built by JS --></nav>
          <div class="side-foot">
            <button class="side-refresh" id="side-refresh" title="Reload, bypassing the browser cache">
              <svg viewBox="0 0 20 20"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16.6 2.6v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Refresh</span>
              <span class="sf-build" id="sf-build"></span>
            </button>
          </div>
        </aside>

        <!-- narrow screens: the sidebar floats over the content, so give it a way out -->
        <div class="side-scrim" id="side-scrim"></div>

        <!-- the one way back in once the sidebar's own button has collapsed it -->
        <button class="side-expand" id="side-expand" title="Show sidebar" aria-label="Show sidebar">
          <svg viewBox="0 0 20 20"><use href="#t-collapse"/></svg>
        </button>

        <div class="main">
          <div class="toolbar" id="toolbar">
            <div class="tb-nav">
              <button class="tb-btn" id="tb-back" title="Back" disabled><svg viewBox="0 0 20 20"><use href="#t-back"/></svg></button>
              <button class="tb-btn" id="tb-fwd" title="Forward" disabled><svg viewBox="0 0 20 20"><use href="#t-fwd"/></svg></button>
            </div>
            <div class="tb-title" id="tb-title"></div>
            <div class="tb-spacer"></div>
            <div class="tb-search" id="tb-search">
              <input type="text" id="tb-search-input" placeholder="Search" autocomplete="off" spellcheck="false" title="Search this site">
              <div class="tb-search-results" id="tb-search-results" hidden></div>
            </div>
          </div>

          <div class="content" id="content" tabindex="0">
            <div class="desk-view" id="desk-view" hidden></div>
            <div class="icon-view" id="icon-view"></div>
            <div class="digital-view" id="digital-view" hidden></div>
            <div class="list-view" id="list-view" hidden></div>
            <div class="columns-view" id="columns-view" hidden></div>
            <div class="gallery-view" id="gallery-view" hidden></div>
            <div class="films-view" id="films-view" hidden></div>
            <div class="films-section-view" id="films-section-view" hidden></div>
            <div class="film-detail-view" id="film-detail-view" hidden></div>
            <div class="rubber-band" id="rubber-band" hidden></div>
          </div>

          <div class="statusbar">
            <span class="status-text" id="status-text">0 items</span>
          </div>
        </div>
      </div>
      <div class="resize-handle" id="resize-handle"></div>
    </section>
  </div>

  <!-- ============ contact sheet: end-credits style, reached from the sidebar ============ -->
  <div class="contact-layer" id="contact-layer" hidden>
    <button class="contact-close" id="contact-close" aria-label="Close">
      <svg viewBox="0 0 20 20"><path d="M4.5 4.5l11 11M15.5 4.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <div class="contact-sheet">
      <div class="cs-row"><div class="cs-label">School Email</div><div class="cs-value">hl5250@nyu.edu</div></div>
      <div class="cs-row"><div class="cs-label">WeChat</div><div class="cs-value">haolarrr</div></div>
      <div class="cs-row"><div class="cs-label">Phone</div><div class="cs-value">+1 646 301 6815</div></div>
    </div>
  </div>

  <!-- ============ still lightbox: enlarge a frame from a film's detail page ============ -->
  <div class="still-lightbox" id="still-lightbox" hidden>
    <button class="sl-close" id="sl-close" aria-label="Close">
      <svg viewBox="0 0 20 20"><path d="M4.5 4.5l11 11M15.5 4.5l-11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="sl-nav sl-prev" id="sl-prev" aria-label="Previous">
      <svg viewBox="0 0 20 20"><path d="M12.5 3.5 6 10l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="sl-nav sl-next" id="sl-next" aria-label="Next">
      <svg viewBox="0 0 20 20"><path d="M7.5 3.5 14 10l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img class="sl-img" id="sl-img" src="" alt="">
    <div class="sl-count" id="sl-count"></div>
  </div>

  <!-- context menu / quick look / get info render here -->
  <div id="overlay-layer"></div>

  <script src="assets/app.js?v=53"></script>
</body>
</html>
