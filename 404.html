<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Haolang Li</title>
<!--
  GitHub Pages has no server-side routing: a direct hit (or a reload) on a
  clean URL like /films isn't a real file, so GitHub serves this 404 page
  instead. Stash the path the visitor actually wanted, then bounce to the
  real app at "/" — it reads this back on boot (see initialNodeFromLocation
  in assets/app.js) and lands on the right section, URL bar and all.
-->
<script>
  try { sessionStorage.setItem("hl-redirect-path", location.pathname + location.search + location.hash); } catch (e) {}
  location.replace("/");
</script>
</head>
<body></body>
</html>
